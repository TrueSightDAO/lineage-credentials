name: Build CV cache

on:
  push:
    branches: [main]
    paths:
      - 'programs/**'
      - '_cache/cv/**.json'
      - '.github/workflows/build-cv-cache.yml'
  workflow_dispatch: {}

# Need write to push the regenerated _cache back into this same repo.
permissions:
  contents: write

# If multiple pushes hit in rapid succession, only the latest matters.
concurrency:
  group: build-cv-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the rebuild for commits the workflow itself made (the [skip ci]
    # convention) — otherwise every cache commit triggers another run.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout lineage-credentials (data)
        uses: actions/checkout@v4
        with:
          path: data
          fetch-depth: 0

      - name: Checkout lineage-engine (code) at main
        uses: actions/checkout@v4
        with:
          repository: TrueSightDAO/lineage-engine
          ref: main
          path: engine

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WeasyPrint system dependencies
        # WeasyPrint needs pango / cairo / harfbuzz to render PDFs.
        # `ubuntu-latest` has glib + cairo preinstalled but pango/harfbuzz vary.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev \
            libcairo2 libgdk-pixbuf-2.0-0 fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
          pip install weasyprint

      - name: Build CV cache
        run: |
          cd engine
          python scripts/build_cv_cache.py --data ../data

      - name: Commit + push if changed
        working-directory: data
        run: |
          git config user.name 'lineage-credentials-builder[bot]'
          git config user.email 'lineage-credentials-builder@users.noreply.github.com'
          git add _cache
          if git diff --cached --quiet; then
            echo 'No cache changes to commit.'
            exit 0
          fi
          git commit -m 'chore(cache): regenerate _cache/ [skip ci]'
          # Retry with rebase if push rejected — protects against the race when
          # the concurrency group queues this run but another commit landed on
          # main between checkout and push. We rebase our cache commit on top
          # of whatever advanced main, then push again. Up to 5 attempts.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching + rebasing"
            git fetch origin main
            git rebase origin/main || {
              echo 'Rebase failed (likely cache conflict) — falling back to re-add'
              git rebase --abort || true
              git reset --soft origin/main
              git add _cache
              git diff --cached --quiet && { echo 'No changes after rebase'; exit 0; }
              git commit -m 'chore(cache): regenerate _cache/ [skip ci]'
            }
          done
          echo 'Push failed after 5 attempts — manual intervention needed'
          exit 1
