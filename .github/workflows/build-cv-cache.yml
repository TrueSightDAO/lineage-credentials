name: Build CV cache

on:
  push:
    branches: [main]
    paths:
      - 'programs/**'
      - '_cache/cv/**.json'
      - '.github/workflows/build-cv-cache.yml'
  workflow_dispatch: {}
  # Phase 4.1 (spec §18.7) — Scored Chatlogs is a Google Sheet, not a Git
  # repo, so push triggers can't see new submissions. The cron makes sure
  # the rebuild fires periodically and pending-claim sections refresh on
  # the credential pages without operator action. Every 2h reduces staleness window (≤2h delay between submission and surfacing) and makes a single dropped run less impactful
  # tradeoff between freshness (≤2h delay between submission and surfacing)
  # and CI minutes (12 runs/day; each ~2min wall-clock; ~5 runs no-op when
  # neither Sheet nor data repo changed). The build commits back with
  # `[skip ci]` so a scheduled run doesn't cascade into another run.
  schedule:
    - cron: '0 */2 * * *'

# Need write to push the regenerated _cache back into this same repo.
permissions:
  contents: write

# If multiple pushes hit in rapid succession, only the latest matters.
concurrency:
  group: build-cv-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the rebuild for commits the workflow itself made (the [skip ci]
    # convention) — otherwise every cache commit triggers another run.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout lineage-credentials (data)
        uses: actions/checkout@v4
        with:
          path: data
          fetch-depth: 0

      - name: Checkout lineage-engine (code) at main
        uses: actions/checkout@v4
        with:
          repository: TrueSightDAO/lineage-engine
          ref: main
          path: engine

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WeasyPrint system dependencies
        # WeasyPrint needs pango / cairo / harfbuzz to render PDFs.
        # `ubuntu-latest` has glib + cairo preinstalled but pango/harfbuzz vary.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi-dev \
            libcairo2 libgdk-pixbuf-2.0-0 fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
          pip install weasyprint

      # Phase 4.1 — Materialize Google service-account creds from a repo
      # secret so build_cv_cache.py can reach `Scored Chatlogs` and emit
      # cv['pending_contributions']. When the secret isn't set, this step
      # writes an empty file and the build silently degrades — pending
      # sections stay empty but canonical Ledger history rendering is
      # unaffected. To enable the pending-claim surface, add the secret
      # `LINEAGE_GOOGLE_CREDENTIALS_JSON` to this repo (org-level also
      # works) with the contents of a service-account JSON that has read
      # access to spreadsheets 1Tbj7H5... and 1GE7PUq...
      - name: Materialize Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.LINEAGE_GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -z "${GOOGLE_CREDENTIALS_JSON:-}" ]; then
            echo "::warning::LINEAGE_GOOGLE_CREDENTIALS_JSON secret not set — pending Scored Chatlogs fetch will be skipped"
            echo "{}" > /tmp/google_creds.json
          else
            printf '%s' "$GOOGLE_CREDENTIALS_JSON" > /tmp/google_creds.json
            echo "Credentials written ($(wc -c </tmp/google_creds.json) bytes)"
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/google_creds.json" >> "$GITHUB_ENV"

      - name: Build CV cache
        run: |
          cd engine
          python scripts/build_cv_cache.py --data ../data

      - name: Commit + push if changed
        id: cache_commit
        working-directory: data
        run: |
          git config user.name 'lineage-credentials-builder[bot]'
          git config user.email 'lineage-credentials-builder@users.noreply.github.com'
          git add _cache
          if git diff --cached --quiet; then
            echo 'No cache changes to commit.'
            exit 0
          fi
          git commit -m 'chore(cache): regenerate _cache/ [skip ci]'
          # Retry with rebase if push rejected — protects against the race when
          # the concurrency group queues this run but another commit landed on
          # main between checkout and push. We rebase our cache commit on top
          # of whatever advanced main, then push again. Up to 5 attempts.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching + rebasing"
            git fetch origin main
            git rebase origin/main || {
              echo 'Rebase failed (likely cache conflict) — falling back to re-add'
              git rebase --abort || true
              git reset --soft origin/main
              git add _cache
              git diff --cached --quiet && { echo 'No changes after rebase'; exit 0; }
              git commit -m 'chore(cache): regenerate _cache/ [skip ci]'
            }
          done
          echo 'Push failed after 5 attempts — manual intervention needed'
          exit 1

      # jsDelivr (the credential pages' PRIMARY data source via
      # program-shell.js) caches @main branch files for 12h+, so freshly
      # rebuilt CVs render stale on truesight.me long after this workflow
      # commits them. Purge the CDN copy of materially changed CVs.
      # Every rebuild bumps generated_at in EVERY file (+1/-1), so we only
      # purge JSONs whose diff exceeds that single line — purging ~750
      # timestamp-only changes per run would hammer the purge API for
      # nothing the pages care about. Cap at 100 per run as a safety valve.
      - name: Purge jsDelivr for materially changed CVs
        if: steps.cache_commit.outputs.pushed == 'true'
        working-directory: data
        run: |
          git diff HEAD~1 HEAD --numstat -- '_cache/cv/*.json' \
            | awk -F'	' '($1+$2)>2 {print $3}' | head -100 \
            | while read -r f; do
                curl -s --max-time 20 "https://purge.jsdelivr.net/gh/TrueSightDAO/lineage-credentials@main/$f" >/dev/null \
                  && echo "purged: $f" || echo "::warning::purge failed: $f"
              done
          echo "Purge pass complete."